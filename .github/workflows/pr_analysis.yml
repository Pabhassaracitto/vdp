name: Flutter Analysis (analyze + test)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  analysis:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Asset dirs referenced by pubspec.yaml but not present in git
      # (same workaround as full_build.yml).
      - name: Ensure asset dirs
        run: mkdir -p assets/animations assets/audio assets/data

      # Never let `flutter pub get` hard-fail the job: its own exit code can be
      # non-zero for reasons that do not actually block `flutter analyze`/
      # `flutter test` below (e.g. the bundled `flutter gen-l10n` hook exiting
      # non-zero after dependencies were already resolved). Capture its output
      # instead so a real failure is still visible in the PR comment/summary,
      # and let Analyze/Test run and report their own, more specific errors.
      - name: Install dependencies
        id: pub_get
        run: |
          set +e
          flutter pub get > pub_get.txt 2>&1
          code=$?
          cat pub_get.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify analyzer report parser
        run: python3 -m unittest tool.test_report_flutter_analyze

      # main already contains many lint/info findings. Report them but fail only
      # on real analyzer errors; do not turn the check green for broken code.
      - name: Analyze
        id: analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report analyze findings
        if: always()
        run: |
          {
            echo "## flutter pub get (exit ${{ steps.pub_get.outputs.code }})"
            if [ "${{ steps.pub_get.outputs.code }}" != "0" ]; then
              echo '```text'
              tail -n 60 pub_get.txt
              echo '```'
            fi
            echo
          } > analyze_report.txt
          python3 tool/report_flutter_analyze.py report analyze.txt >> analyze_report.txt
          cat analyze_report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Emit analyzer annotations
        if: always()
        run: python3 tool/report_flutter_analyze.py annotations analyze.txt

      - name: Test
        id: test
        if: always()
        run: |
          set +e
          flutter test > test_output.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report test results
        if: always()
        run: |
          {
            echo
            echo "## flutter test"
            echo '```text'
            tail -n 80 test_output.txt
            echo '```'
          } >> analyze_report.txt
          tail -n 25 test_output.txt
          grep '\[E\]' test_output.txt | sort -u | head -10 > failed_tests.txt || true
          while IFS= read -r line; do
            printf '::error::%s\n' "${line:0:280}"
          done < failed_tests.txt

      - name: Comment results on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --state open --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number // empty')
          [ -z "$PR" ] && { echo "no open PR for ${GITHUB_REF_NAME}; skipping comment"; exit 0; }
          {
            echo "## CI analysis report — commit \`${GITHUB_SHA:0:7}\`"
            echo
            echo "analyze exit: \`${{ steps.analyze.outputs.code }}\` · test exit: \`${{ steps.test.outputs.code }}\`"
            echo
            tail -c 55000 analyze_report.txt
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

      - name: Verdict
        if: always()
        run: |
          echo "analyze=${{ steps.analyze.outputs.code }} test=${{ steps.test.outputs.code }}"
          [ "${{ steps.analyze.outputs.code }}" = "0" ] && [ "${{ steps.test.outputs.code }}" = "0" ]