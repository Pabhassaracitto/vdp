name: Deploy Web to GitHub Pages

# Builds the Flutter web app and publishes it to GitHub Pages so the app is
# reachable online at https://<owner>.github.io/<repo>/
#
# One-time manual setup required (cannot be done via this workflow):
#   Repo Settings -> Pages -> "Build and deployment" -> Source: "GitHub Actions"
# After that, every push to `main` (or a manual run) redeploys automatically.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let in-flight runs finish instead of being
# cancelled mid-upload.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create empty asset directories if missing
        run: mkdir -p assets/animations assets/audio assets/data

      - name: Get dependencies
        # Retry once after a short backoff: `flutter pub get` occasionally
        # fails transiently on pub.dev (observed twice on 2026-10-04) which
        # must not kill the whole web deployment.
        run: flutter pub get || (sleep 20 && flutter pub get)

      - name: Build Web
        # base-href must match the GitHub Pages project-site path
        # (https://<owner>.github.io/<repo>/). If this repo is ever served
        # from a custom domain or as a user/organization root site, change
        # this to "/" instead.
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Explain deploy failure
        if: failure()
        run: |
          echo "::error::Deploy failed - GitHub Pages may not be enabled for this repo. Open Settings -> Pages -> Build and deployment -> Source: 'GitHub Actions', then re-run this workflow."
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Deploy to GitHub Pages failed

          Every run of this workflow has failed at the deploy step since it
          was added - most likely cause: **GitHub Pages is not enabled for
          this repository** (the one-time manual setup this file documents
          in its header comment; it cannot be done from a workflow).

          Fix (repo admin, once):
          1. Repo **Settings -> Pages**
          2. *Build and deployment* -> **Source: GitHub Actions**
          3. Re-run this workflow (or push to main).
          SUMMARY
