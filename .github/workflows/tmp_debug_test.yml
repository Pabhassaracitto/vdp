name: TMP debug failing test (delete before merge)

on:
  push:
    branches:
      - 'arena/ddba1afd-vdp'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Ensure asset dirs
        run: mkdir -p assets/animations assets/audio assets/data
      - name: Pub get
        run: flutter pub get || true
      - name: Debug failing test
        run: |
          set +e
          flutter test test/global_audio_bubble_web_test.dart --reporter expanded > out.txt 2>&1
          echo "flutter test exit=$?"
          python3 - <<'PY'
          lines = open('out.txt', errors='replace').read().splitlines()
          body = '\n'.join(l[:400] for l in lines)
          print('::error::total_lines=%d' % len(lines))
          print('::error::' + body.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          PY
          tail -20 out.txt
