# TEMPORARY debug workflow — chạy riêng test/global_audio_bubble_web_test.dart
# với reporter expanded và comment FULL output lên PR để debug từ xa.
# SẼ BỊ XOÁ trước khi merge (không phải một phần của fix).
name: DEBUG ztmp expanded test log

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  debug:
    name: flutter test expanded (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Ensure asset dirs
        run: mkdir -p assets/animations assets/audio assets/data
      - name: Install dependencies
        run: flutter pub get || true
      - name: Run target test (expanded reporter)
        run: |
          set +e
          flutter test test/global_audio_bubble_web_test.dart --reporter expanded > dbg_out.txt 2>&1
          echo "exit=$?" >> dbg_out.txt
          exit 0
      - name: Comment output on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --state open --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number // empty')
          [ -z "$PR" ] && exit 0
          { echo '## DEBUG expanded test output'; echo '```text'; tail -c 60000 dbg_out.txt; echo '```'; } > comment.md
          gh pr comment "$PR" --body-file comment.md
