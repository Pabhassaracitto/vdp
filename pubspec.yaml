name: vdp_app
description: AbhiDhamma - an interactive Abhidhamma study app based on the King Milanda A curriculum
version: 0.2.0+5
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Audio (Pali pronunciation)
  just_audio: ^0.9.36
  
  # UI & Animation
  flutter_animate: ^4.3.0
  lottie: ^3.1.0
  
  # Data
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0 #Change from 4.8.1
  
  # Navigation
  go_router: ^12.1.3
  
  # Accessibility
  flutter_tts: ^4.2.5
  
  # Utils
  collection: ^1.18.0
  path_provider: ^2.1.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/data/
    - assets/content/
    - assets/images/
  
  fonts:
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
        - asset: assets/fonts/Sarabun-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sarabun-Light.ttf
          weight: 300
    # Offline Noto subsets generated by tool/subset_fonts.py. Each subset only
    # contains glyphs used by the bundled UI, keeping the total near 4 MB.
    - family: NotoSansApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansApp.ttf
    - family: NotoSansArabicApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansArabicApp.ttf
    - family: NotoSansBengaliApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansBengaliApp.ttf
    - family: NotoSerifTibetanApp
      fonts:
        - asset: assets/fonts/subsets/NotoSerifTibetanApp.ttf
    - family: NotoSansDevanagariApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansDevanagariApp.ttf
    - family: NotoSansMyanmarApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansMyanmarApp.ttf
    - family: NotoSansSinhalaApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansSinhalaApp.ttf
    - family: NotoSansKhmerApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansKhmerApp.ttf
    - family: NotoSansLaoApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansLaoApp.ttf
    - family: NotoSansTamilApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansTamilApp.ttf
    - family: NotoSansTeluguApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansTeluguApp.ttf
    - family: NotoSansThaiApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansThaiApp.ttf
    - family: NotoSansSCApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansSCApp.ttf
    - family: NotoSansTCApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansTCApp.ttf
    - family: NotoSansJPApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansJPApp.ttf
    - family: NotoSansKRApp
      fonts:
        - asset: assets/fonts/subsets/NotoSansKRApp.ttf
