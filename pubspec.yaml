name: vdp_app
description: Vi Diệu Pháp (Abhidhamma) - Ứng dụng học tương tác theo giáo trình King Milanda A
version: 0.2.0+5
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Audio (Pali pronunciation)
  just_audio: ^0.9.36
  
  # UI & Animation
  flutter_animate: ^4.3.0
  lottie: ^3.1.0
  
  # Data
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0 #Change from 4.8.1
  
  # Navigation
  go_router: ^12.1.3
  
  # Accessibility
  flutter_tts: ^4.2.5
  
  # Utils
  collection: ^1.18.0
  path_provider: ^2.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/
    - assets/images/
  
  fonts:
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
        - asset: assets/fonts/Sarabun-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sarabun-Light.ttf
          weight: 300
